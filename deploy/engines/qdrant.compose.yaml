# Qdrant 1.17.0 for the vector benchmark: the same version as the native Qdrant on this box
# (qdrant.service), in a container so it gets the same CPU split and the same kind of network route as
# every other engine. The benchmark's "qdrant" and "qdrant-hnsw" targets use it; the native server
# stays measurable as the comparison target "qdrant-native".
# Image pinned by digest (Docker Hub, the multi-platform index of qdrant/qdrant:v1.17.0, verified
# 2026-10-04). The image's own config is used unchanged: every storage and optimizer value in it is
# Qdrant's default, which is what the native server runs with too (its config.yaml sets only paths
# and ports).
# Ports 6333 (HTTP) and 6334 (gRPC) are published on 127.0.0.1:16333 and 127.0.0.1:16334 only (6333
# and 6334 are the native server's); the benchmark itself connects to the container's own bridge
# address and ports 6333/6334, never through docker-proxy.
# Settings, and why:
#   cpuset ${GVB_ENGINE_CPUS:-2-3,6-7}  held to the engine CPUs from creation, so Qdrant sizes its search
#                                        and optimizer threads for the CPUs it really has. 2-3,6-7 is the
#                                        split the benchmark's machine control picks on linus7795 (physical
#                                        cores 2 and 3 with their hyperthreads); when run-all starts this
#                                        file it passes the split it chose through a compose override, so
#                                        the default only matters for a start by hand.
#   mem_limit 8g                         the same limit as the other single-container engines.
# The health check asks /readyz with bash alone (the image has no curl).
# Start: sudo docker compose -f deploy/engines/qdrant.compose.yaml up -d
# Stop (data kept): sudo docker compose -f deploy/engines/qdrant.compose.yaml down
# Own project name so this file never sees (or removes) the other engines' containers.
name: gvb-qdrant
services:
  qdrant:
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    container_name: gvb-qdrant
    cpuset: "${GVB_ENGINE_CPUS:-2-3,6-7}"
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    volumes:
      - /home/dan/gvb-data/engines/qdrant:/qdrant/storage
    mem_limit: 8g
    stop_grace_period: 30s
    restart: "no"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5s
