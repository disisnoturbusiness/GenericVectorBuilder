# Milvus standalone: ONE container, embedded etcd, local-disk object storage (no MinIO).
# REST API v2 on 127.0.0.1:19530, health/metrics on 127.0.0.1:9091.
# No password: authorization is off and both ports are bound to loopback only.
# The embedded etcd config is inlined below so no extra file has to live beside this one.
# Start:  sudo docker compose -f deploy/engines/milvus.compose.yaml up -d
# Stop:   sudo docker compose -f deploy/engines/milvus.compose.yaml down   (data is kept)
#
# Two facts about this engine's start-up and stop (measured 2026-10-05, Milvus v2.6.25):
# 1. A stop always ends with exit code 134 ("panic: context canceled", Milvus closing its etcd client
#    while the embedded etcd shuts down). That is how a clean stop looks here, not a failure.
# 2. A start can exit with 134 and "panic: etcdserver: leader changed". The restarted embedded etcd
#    needs 1 to 2 seconds to elect itself leader, Milvus's coordinator reads etcd at once, and when that
#    read is in flight at the election it fails and Milvus panics. Whether the read is caught depends on
#    how long etcd takes to replay its log, and etcd replays everything since its last snapshot, which by
#    default is up to 100000 entries. Measured on a fresh folder: restarts were fine up to about 6000
#    log entries and failed every time from about 10000 (a 9.9 GB folder at 12900 entries failed 14 of 14
#    starts). It is not host load and not the size of the data (emptying either data directory changed nothing).
#    snapshot-count below keeps the replay short for good: a folder at 17000 entries failed once (the
#    failed start still wrote the snapshot), then started every time, and 18 restarts in a row were
#    healthy while the log grew to 79000 entries. The bench's ComposeRunner retries a start whose
#    container exited, so that one failed start is absorbed. If a folder still cannot start, it holds only
#    benchmark data: stop the engine, move the folder aside (mv /home/dan/gvb-data/engines/milvus
#    /home/dan/gvb-data/engines/milvus.broken-YYYYMMDD), create an empty one and start again.
# 3. A start soon after a stop was seen once to hang under host load 7 to 10: unhealthy reported at 230 s,
#    healthy by itself at 320 s. Inferred, not proven: a session lease of the previous run (300 s, see
#    COMMON_SESSION_TTL) kept the new coordinator in standby until it lapsed. The health check below
#    therefore waits well past 300 s instead of giving up at 240 s.
name: gvb-milvus

configs:
  embed_etcd:
    content: |
      listen-client-urls: http://127.0.0.1:2379
      advertise-client-urls: http://127.0.0.1:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: '1000'
      # Snapshot every 1000 log entries (etcd's default is 100000) so a restart replays a short log; see the header.
      snapshot-count: 1000

services:
  milvus:
    image: milvusdb/milvus:v2.6.25
    container_name: gvb-milvus
    restart: "no"
    stop_grace_period: 60s
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      # Milvus exits when its etcd lease lapses (default 30 s). On a busy host the embedded etcd
      # can stall for seconds, so the lease is made far more forgiving. 2026-10-03: with the host
      # at load average 30 on 8 cores, a 100,000-vector load killed the default-lease container.
      COMMON_SESSION_TTL: "300"
    configs:
      - source: embed_etcd
        target: /milvus/configs/embedEtcd.yaml
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - /home/dan/gvb-data/engines/milvus:/var/lib/milvus
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
