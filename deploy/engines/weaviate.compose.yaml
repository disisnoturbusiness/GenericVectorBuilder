# Weaviate (single node, anonymous access, no vectorizer modules: we always supply vectors).
# REST + GraphQL on 127.0.0.1:8085 (container port 8080), gRPC on 127.0.0.1:50051.
# No password: anonymous access is on and both ports are bound to loopback only.
# Start:  sudo docker compose -f deploy/engines/weaviate.compose.yaml up -d
# Stop:   sudo docker compose -f deploy/engines/weaviate.compose.yaml down   (data is kept)
name: gvb-weaviate

services:
  weaviate:
    image: semitechnologies/weaviate:1.39.8
    container_name: gvb-weaviate
    restart: "no"
    stop_grace_period: 60s
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      QUERY_DEFAULTS_LIMIT: "25"
      DISABLE_TELEMETRY: "true"
      GOMEMLIMIT: 6GiB
    ports:
      - "127.0.0.1:8085:8080"
      - "127.0.0.1:50051:50051"
    volumes:
      - /home/dan/gvb-data/engines/weaviate:/var/lib/weaviate
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
