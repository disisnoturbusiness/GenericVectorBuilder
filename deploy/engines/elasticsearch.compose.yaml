# Elasticsearch 9.5.3 for the vector benchmark: single node, security off, 2 GB heap.
# Why security is off: the port is bound to 127.0.0.1 only and the data is throwaway benchmark data.
# Start: sudo docker compose -f deploy/engines/elasticsearch.compose.yaml up -d
# Stop (data kept): sudo docker compose -f deploy/engines/elasticsearch.compose.yaml down
services:
  elasticsearch:
    image: elasticsearch:9.5.3
    container_name: gvb-elasticsearch
    restart: "no"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - /home/dan/gvb-data/engines/elasticsearch:/usr/share/elasticsearch/data
    mem_limit: 6g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
