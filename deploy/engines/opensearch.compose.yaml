# OpenSearch 3.9.0 for the vector benchmark: single node, security plugin off, 2 GB heap.
# Host port 9201 (9200 belongs to Elasticsearch). The k-NN plugin keeps its HNSW graphs outside
# the Java heap, so the container limit is larger than the heap.
# Why security is off: the port is bound to 127.0.0.1 only and the data is throwaway benchmark data.
# Start: sudo docker compose -f deploy/engines/opensearch.compose.yaml up -d
# Stop (data kept): sudo docker compose -f deploy/engines/opensearch.compose.yaml down
services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: gvb-opensearch
    restart: "no"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - /home/dan/gvb-data/engines/opensearch:/usr/share/opensearch/data
    mem_limit: 6g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
