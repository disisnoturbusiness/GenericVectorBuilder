# ClickHouse 26.3 server. HTTP interface on 127.0.0.1:8123 only. A user named gvb is created
# with the password from secrets.env (CLICKHOUSE_PASSWORD) through env_file.
# The image starts as root and gives the data dir to its clickhouse user (uid 101) itself.
# Own project name so this file never sees (or removes) the other engines' containers.
name: gvb-clickhouse
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.39.7
    container_name: gvb-clickhouse
    env_file:
      - /home/dan/gvb-data/engines/secrets.env
    environment:
      CLICKHOUSE_USER: gvb
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - /home/dan/gvb-data/engines/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 8g
    stop_grace_period: 60s
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20
